[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-mechanisms"
version = "0.1.0"
description = "Activation readouts and interventions for unresolved-outcome forecasts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.3,<2.11",
  "transformers>=4.57,<5",
  "accelerate>=1.0,<2",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.25,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
nla = ["httpx>=0.27,<1", "orjson>=3.10,<4", "sglang[all]>=0.5.6,<0.6"]

[project.scripts]
forecast-mechanisms = "forecast_mechanisms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

